version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smarthome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - smarthome-network

  redis:
    image: redis:7-alpine
    container_name: smarthome-redis
    ports:
      - "6379:6379"
    networks:
      - smarthome-network

  # Брокер сообщений для интеграции
  rabbitmq:
    image: rabbitmq:3-management
    container_name: smarthome-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - smarthome-network

  temperature-api:
    build: ./temperature-api
    container_name: smarthome-temperature-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - smarthome-network
    environment:
      - PORT=8081

  # Микросервисы
  monolith-listener:
    build: ./workers
    container_name: smarthome-monolith-listener
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    networks:
      - smarthome-network

  device-service:
    build: ./device-service
    container_name: smarthome-device-service
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=smarthome
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - MONOLITH_URL=http://app:8080
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - postgres
      - redis
      - rabbitmq 
    networks:
      - smarthome-network

  telemetry-service:
    build: ./telemetry-service
    container_name: smarthome-telemetry-service
    restart: unless-stopped
    ports:
      - "8002:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=smarthome
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DEVICE_SERVICE_URL=http://device-service:80
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - MONOLITH_URL=http://app:8080
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - device-service
      - temperature-api
    networks:
      - smarthome-network

  # Монолит с интеграцией
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_SERVICE_URL=http://device-service:80
      - TELEMETRY_SERVICE_URL=http://telemetry-service:80
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge